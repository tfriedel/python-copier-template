name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Format
        run: uvx ruff format . --check --diff

      - name: Lint
        run: uvx ruff check --output-format=github .

      - name: Typecheck
        run: uv run --frozen pyrefly check

      - name: Deptry
        run: uv run --frozen deptry src

      - name: Complexity
        run: uv run --frozen complexipy src --max-complexity-allowed 15

      - name: Test
        run: uv run --frozen pytest -v
