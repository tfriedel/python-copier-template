[project]
name = "{{project_name}}"
dynamic = ["version"]
description = "{{description}}"
readme = "README.md"
authors = [{ name = "{{author_name}}", email = "{{author_email}}" }]
requires-python = ">={{python_version}}"
dependencies = ["loguru>=0.7.0"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{package_name}}"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true

[dependency-groups]
dev = [
  "complexipy>=5.4.1",
  "coverage[toml]>=7.13.5",
  "deptry>=0.25.1",
  "git-cliff>=2.13.1",
  "prek>=0.3.13",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "pytest-socket>=0.7.0",
  "pytest-sugar>=1.1.1",
  "pytest-testmon>=2.2.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.15.12",
  "sync-with-uv>=0.5.0",
  "tdd-guard-pytest>=0.1.2",
  "ty>=0.0.34",
]

[tool.ruff]
line-length = 100
target-version = "py{{python_version | replace('.', '')}}"
exclude = [".git", ".ruff_cache", ".venv", ".vscode"]

[tool.ruff.lint]
preview = true
select = [
  "ANN",     # type annotation
  "B",       # flake8-bugbear
  "D",       # pydocstyle
  "E",       # pycodestyle errors
  "F",       # pyflakes
  "I",       # isort
  "PLR0912", # too many branches
  "PTH",     # use `pathlib.Path` instead of `os.path`
  "RUF",     # ruff specific rules
  "SIM",     # flake8-simplify
  "UP",      # pyupgrade
  "W",       # pycodestyle warnings
]
ignore = [
  "ANN401", # Checks that function arguments are annotated with a more specific type than Any.
  "B007",   # Unused loop variable
  "B008",   # Function call in default argument
  "B905",   # `zip()` without `strict=True`
  "COM812", # Missing trailing comma
  "COM819", # Trailing comma prohibited
  "D1",     # Missing docstring in public module, class, function, or method
  "D203",   # One blank line required before class docstring (ignored because D211 is prioritized in pydocstyle convention 'google')
  "D205",   # 1 blank line required between summary line and description
  "D212",   # Multi-line docstring summary should start at the first line
  "D213",   # Multi-line docstring summary should start at the second line
  "D400",   # First line of docstring should end with a period
  "D415",   # First line of docstring should end with punctuation (period, question mark, or exclamation point)
  "E114",   # Indentation is not a multiple of four (comment)
  "G004",   # Logging statement uses f-string
  "ISC001", # Implicit string concatenation on a single line
  "ISC002", # Implicit string concatenation on multiple lines
  "PTH123", # `open()` should be replaced by `Path.open()`
  "Q000",   # Single quotes found when double quotes are preferred
  "Q001",   # Single quotes found when double quotes are preferred for multi-line strings
  "Q002",   # Single quotes found when double quotes are preferred for docstrings
  "RUF002", # Checks for ambiguous Unicode characters in docstrings.
  "RUF003", # Checks for ambiguous Unicode characters in comments.
  "SIM105", # try-except-pass blocks that can be replaced with the contextlib.suppress context manager.
  "SIM108", # Use ternary operator instead of `if`-`else`-block
  "SIM116", # Use a dictionary instead of consecutive `if` statements
]
unfixable = [
  "F401", # unused import
  "F841", # unused variable
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "{{python_version}}"
root = ["./src"]

[tool.ty.src]
include = ["src", "tests"]

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.deptry]

[tool.complexipy]
paths = ["src"]
max-complexity-allowed = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
# uv-dynamic-versioning derives the version from git, which changes every commit.
# Tell testmon to ignore that so it doesn't invalidate its cache on every commit.
testmon_ignore_dependencies = ["{{package_name}}"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks integration tests",
  "unit: marks unit tests",
]
