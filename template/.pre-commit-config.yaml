repos:
  - repo: https://github.com/tsvikas/sync-with-uv
    rev: v0.5.0
    hooks:
      - id: sync-with-uv
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.11.11
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.12
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly type checker
        entry: uv run --frozen pyrefly check
        language: system
        types: [python]
        pass_filenames: false
      - id: complexipy
        name: Complexipy cognitive complexity
        entry: uv run --frozen complexipy src --max-complexity-allowed 15
        language: system
        types: [python]
        pass_filenames: false
